<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Блог о выступлениях на IT-конференциях. Практические советы, личный опыт, мотивация для спикеров">
    <title>Блог - Smart Effect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header - Loaded dynamically via menu.js -->
    <header class="header"></header>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1>БЛОГ О ВЫСТУПЛЕНИЯХ НА IT КОНФЕРЕНЦИЯХ</h1>
            <p class="page-subtitle">Отвечаю на неудобные вопросы. Рассказываю, как есть ))</p>
        </div>
    </section>

    <!-- Blog Content -->
    <section class="blog-content">
        <div class="container">
            <!-- Tags Filter -->
            <div class="blog-tags-filter" id="blogTagsFilter">
                <button class="tag-filter-btn active" data-tag="all">Все записи</button>
                <!-- Tags will be dynamically inserted here -->
            </div>

            <!-- Blog Posts Grid -->
            <div class="blog-grid" id="blogGrid">
                <!-- Posts will be dynamically inserted here -->
            </div>

            <!-- Pagination -->
            <div class="blog-pagination" id="blogPagination">
                <!-- Pagination will be dynamically inserted here -->
            </div>
        </div>
    </section>

    <!-- Footer - Loaded dynamically via footer.js -->
    <footer class="footer"></footer>

    <script src="js/menu.js"></script>
    <script src="js/page-header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
