<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Выступления Натальи Кузменковой на IT-конференциях">
    <title>Видео - Наталья Кузменкова | Smart Effect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header - Loaded dynamically via menu.js -->
    <header class="header"></header>

    <!-- Page Header -->
    <section class="page-header-video">
        <div class="container">
            <div class="page-header-wrapper">
                <div class="page-header-content">
                    <h1 class="page-header-title">Выступления на IT-конференциях</h1>
                    <p class="page-header-subtitle">Рекомендуется к просмотру аналитикам, менеджерам, продакт-оунерам, лидерам и управленцам</p>
                </div>
                <div class="page-header-image">
                    <div class="page-header-photo-wrapper">
                        <img src="images/nk-3.png" alt="Наталья Кузменкова" class="page-header-photo">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Video Content -->
    <section class="video-content">
        <div class="container">
            <div class="video-grid" id="videoGrid">
                <!-- Videos will be dynamically inserted here -->
            </div>

            <div class="text-center" style="margin-top: 60px;">
                <p style="font-size: 1.1rem; color: var(--text-light); margin-bottom: 20px;">
                    Больше выступлений вы найдете на сайте Smart Effect
                </p>
                <a href="https://smart-effect.ru/video" target="_blank" rel="noopener" class="btn btn-outline">Все видео на сайте</a>
            </div>
        </div>
    </section>

    <!-- Footer - Loaded dynamically via footer.js -->
    <footer class="footer"></footer>

    <script src="js/menu.js"></script>
    <script src="js/page-header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/video.js"></script>
</body>
</html>
